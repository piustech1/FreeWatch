<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="movBgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.30"/>
      <stop offset="70%" stop-color="#4F46E5" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="movCardGrad" x1="40" y1="50" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="movReelGrad" x1="60" y1="60" x2="140" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E676" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="movGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="100" cy="100" r="90" fill="url(#movBgGlow)"/>

  <!-- Film Strip / Clapperboard Back Layer -->
  <g opacity="0.85">
    <rect x="52" y="58" width="96" height="84" rx="18" fill="#151724" stroke="url(#movCardGrad)" stroke-width="2.5"/>
    <!-- Film sprocket perforations -->
    <rect x="62" y="66" width="10" height="12" rx="3" fill="#A78BFA" fill-opacity="0.4"/>
    <rect x="78" y="66" width="10" height="12" rx="3" fill="#A78BFA" fill-opacity="0.4"/>
    <rect x="94" y="66" width="10" height="12" rx="3" fill="#A78BFA" fill-opacity="0.4"/>
    <rect x="110" y="66" width="10" height="12" rx="3" fill="#A78BFA" fill-opacity="0.4"/>
    <rect x="126" y="66" width="10" height="12" rx="3" fill="#A78BFA" fill-opacity="0.4"/>
    
    <!-- Screen cut -->
    <rect x="62" y="86" width="76" height="46" rx="8" fill="#1E2132"/>
  </g>

  <!-- Film Reel Overlap Circle -->
  <circle cx="100" cy="109" r="26" fill="url(#movReelGrad)" fill-opacity="0.15" stroke="url(#movReelGrad)" stroke-width="2.5"/>
  <circle cx="100" cy="109" r="8" fill="#00E676" fill-opacity="0.8"/>
  
  <!-- Sleek Play Wedge -->
  <polygon points="97,102 108,109 97,116" fill="#FFFFFF"/>

  <!-- Floating Sparkles / Particles -->
  <circle cx="152" cy="52" r="3" fill="#00E676" opacity="0.75"/>
  <circle cx="48" cy="144" r="2.5" fill="#A78BFA" opacity="0.6"/>
  <circle cx="156" cy="138" r="2" fill="#60A5FA" opacity="0.7"/>
  <path d="M140 40 L142 45 L147 47 L142 49 L140 54 L138 49 L133 47 L138 45 Z" fill="#00E676" opacity="0.8"/>
</svg>
