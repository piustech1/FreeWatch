<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="notifBgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E676" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#10B981" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bellGrad" x1="70" y1="50" x2="130" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="60%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="50" y1="50" x2="150" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6EE7B7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="100" cy="100" r="90" fill="url(#notifBgGlow)"/>

  <!-- Sound Ripple Arcs -->
  <path d="M136 68 C146 76 152 90 152 104 C152 118 146 130 136 138" 
        stroke="url(#waveGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M64 68 C54 76 48 90 48 104 C48 118 54 130 64 138" 
        stroke="url(#waveGrad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Bell Dome & Body -->
  <path d="M100 52 C88 52 78 62 78 74 L78 98 C78 106 72 112 66 116 L66 122 L134 122 L134 116 C128 112 122 106 122 98 L122 74 C122 62 112 52 100 52 Z" 
        fill="url(#bellGrad)" fill-opacity="0.18" stroke="url(#bellGrad)" stroke-width="3" stroke-linejoin="round"/>

  <!-- Bell Top Finial / Ring -->
  <circle cx="100" cy="46" r="4.5" stroke="url(#bellGrad)" stroke-width="2.2"/>

  <!-- Bell Clapper / Hammer -->
  <path d="M92 125 C92 129 95 133 100 133 C105 133 108 129 108 125" 
        stroke="url(#bellGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Glowing Broadcast Signal Indicator Dot -->
  <circle cx="100" cy="88" r="4" fill="#00E676"/>
  <circle cx="100" cy="88" r="9" stroke="#00E676" stroke-width="1.5" opacity="0.5"/>

  <!-- Sparkle Accents -->
  <circle cx="148" cy="54" r="2.5" fill="#34D399" opacity="0.8"/>
  <circle cx="52" cy="144" r="2" fill="#059669" opacity="0.7"/>
  <path d="M142 120 L144 124 L148 126 L144 128 L142 132 L140 128 L136 126 L140 124 Z" fill="#6EE7B7" opacity="0.75"/>
</svg>
