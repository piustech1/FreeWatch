name: freewatch
description: "FreeWatch - Free Movie Streaming Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # Networking
  dio: ^5.7.0

  # Image Loading & Caching
  cached_network_image: ^3.4.1

  # UI / Animations
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.2.0+3

  # Local Storage
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # Icons
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
