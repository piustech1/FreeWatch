name: Build & Release FreeWatch APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Verify Flutter & Java version
        run: |
          flutter --version
          java -version

      - name: Extract App Version from pubspec.yaml
        id: app_version
        run: |
          VERSION=$(grep -m 1 '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d ' ')
          BUILD=$(grep -m 1 '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f2 | tr -d ' ')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted Version: $VERSION, Build: $BUILD, Tag: v$VERSION"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run unit & widget tests
        run: flutter test

      - name: Build Android Release APK (Universal & Per-ABI)
        run: |
          echo "Building Universal Release APK..."
          flutter build apk --release --android-skip-build-dependency-validation
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/FreeWatch-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/FreeWatch-TV-release.apk
          echo "Building Split Per-ABI APKs..."
          flutter build apk --release --split-per-abi --android-skip-build-dependency-validation || true
          [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ] && cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-artifacts/FreeWatch-arm64-v8a-release.apk || true
          [ -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ] && cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-artifacts/FreeWatch-armeabi-v7a-release.apk || true
          [ -f build/app/outputs/flutter-apk/app-x86_64-release.apk ] && cp build/app/outputs/flutter-apk/app-x86_64-release.apk release-artifacts/FreeWatch-x86_64-release.apk || true
          echo "Release artifacts ready:"
          ls -la release-artifacts/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeWatch-release-apk
          path: release-artifacts/*
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          files: |
            release-artifacts/*.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.app_version.outputs.tag }}
          name: Release ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.app_version.outputs.tag }}
          body: |
            ## 🎬 FreeWatch Release ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.app_version.outputs.tag }}
            
            Download the appropriate APK below and enjoy high-speed Luganda entertainment!
            
            ### 📱 Download Available for All Devices:
            - 📱 **Phone & Tablet (Universal)**: [`FreeWatch-release.apk`](https://github.com/piustech1/FreeWatch/releases/download/${{ steps.app_version.outputs.tag }}/FreeWatch-release.apk)
            - 📺 **Android TV & Fire TV (Universal 16:9 Leanback)**: [`FreeWatch-TV-release.apk`](https://github.com/piustech1/FreeWatch/releases/download/${{ steps.app_version.outputs.tag }}/FreeWatch-TV-release.apk)
            - ⚡ **ARM64-v8a (High-speed 64-bit)**: `FreeWatch-arm64-v8a-release.apk`
            - ⚡ **ARMv7 (32-bit legacy)**: `FreeWatch-armeabi-v7a-release.apk`
            - 💻 **x86_64 (Emulators & Intel TVs)**: `FreeWatch-x86_64-release.apk`
            
            ### ✨ Highlights in this release:
            - 📺 **Android TV 16:9 Landscape UI**: Edge-to-edge leanback TV experience with left navigation rail and zero portrait pillarboxing.
            - 🍿 **Cinematic TV Hero Billboard**: Netflix-style featured billboard with D-Pad focusable "Watch Now" and "Details" buttons.
            - 👤 **Continue as Guest Auth**: Instant streaming on Android TV without remote typing hassle.
            - 📐 **Responsive Multi-Device Grids**: Auto-scaling movie grids from mobile up to 6-column 4K TV screens.
            - 🌐 **Coming Soon Web Portal**: Pure white minimalist launch portal at `freewatchug.online` with direct store links.
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Release & Broadcast Update Notification
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          VERSION="${{ steps.app_version.outputs.version }}"
          BUILD="${{ steps.app_version.outputs.build }}"
          TAG="${{ steps.app_version.outputs.tag }}"
          APK_URL="https://github.com/piustech1/FreeWatch/releases/download/$TAG/FreeWatch-release.apk"
          TV_APK_URL="https://github.com/piustech1/FreeWatch/releases/download/$TAG/FreeWatch-TV-release.apk"
          echo "Broadcasting update for version $VERSION ($BUILD)..."
          cd scripts && (npm ci || npm install) && cd ..
          node scripts/notify_app_update.js "$VERSION" "$BUILD" "$APK_URL" "$TV_APK_URL"
          echo "Update sync and notification broadcast complete."
