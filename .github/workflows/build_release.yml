name: Build & Release FreeWatch APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Verify Flutter & Java version
        run: |
          flutter --version
          java -version

      - name: Extract App Version from pubspec.yaml
        id: app_version
        run: |
          VERSION=$(grep -m 1 '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d ' ')
          BUILD=$(grep -m 1 '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f2 | tr -d ' ')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted Version: $VERSION, Build: $BUILD, Tag: v$VERSION"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run unit & widget tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare APK Release Artifact
        run: |
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/FreeWatch-release.apk
          ls -la release-artifacts/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeWatch-release-apk
          path: release-artifacts/FreeWatch-release.apk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          files: release-artifacts/FreeWatch-release.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.app_version.outputs.tag }}
          name: Release ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.app_version.outputs.tag }}
          body: |
            ## 🎬 FreeWatch Release ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.app_version.outputs.tag }}
            
            Download `FreeWatch-release.apk` below and install it directly on your Android device!
            
            ### ✨ Highlights in this release:
            - 🛡️ **WhatsApp-Style Account Review & Appeal**: Submit suspension review requests directly in the app with real-time status updates and automatic instant unban restoration upon admin approval.
            - 📢 **Smart AdMob Interstitial Ads**: Google Mobile Ads integration with 60-second cooldown protection.
            - 🔄 **Automated Update Detection**: Dynamic runtime PackageInfo verification ensures the update banner strictly hides when the latest version is installed.
            - 💬 **Live Support Chat Push Notifications**: Admin messages & replies in the admin panel instantly notify users and deep-link directly into the chat screen.
            - 💾 **Persistent Offline Downloads**: Multi-tier storage persistence keeps downloaded movies intact across user logout, session switches, and guest mode.
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
