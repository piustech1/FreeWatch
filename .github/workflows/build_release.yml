name: Build & Release FreeWatch APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Verify Flutter & Java version
        run: |
          flutter --version
          java -version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run unit & widget tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare APK Release Artifact
        run: |
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/FreeWatch-release.apk
          ls -la release-artifacts/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeWatch-release-apk
          path: release-artifacts/FreeWatch-release.apk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          files: release-artifacts/FreeWatch-release.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.56' }}
          name: Release ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.56' }}
          body: |
            ## 🎬 FreeWatch Release ${{ github.ref_name }}
            
            Download `FreeWatch-release.apk` below and install it directly on your Android device!
            
            ### ✨ Highlights in this release:
            - 💬 **Live Support Chat Push Notifications**: Admin messages & replies in the admin panel instantly send rich OS notifications that deep-link directly into the `/developer-chat` screen.
            - 💾 **Persistent Offline Downloads**: Multi-tier storage persistence keeps downloaded movies intact across user logout, session switches, and guest mode.
            - 🚀 **In-App Auto-Update System**: Non-intrusive update banner detects new releases via Realtime Database and GitHub API without exposing users to raw GitHub URLs.
            - 🏪 **App Store Product Listing Website**: Sleek Apple App Store inspired landing site with Light & Dark modes, Luganda #1 chart ranking, user ratings, and 1-tap direct APK download.
            - 🛡️ **Zero Mock Data & Real-Time Presence**: Full production integration with Firebase Realtime Database and Firestore.
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
